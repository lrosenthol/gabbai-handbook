publication:
  # Single source of truth for the cover page, running header and PDF
  # document properties.  content/00-cover.md contains no literals.
  title: "The Gabbai's Handbook"
  title_he: "מַדְרִיךְ לְגַּבַּאי"
  subtitle: "A How-To Manual for Gabbi'im"
  author: "Rabbi Leonard Rosenthol"
  date: "5786 / 2026"
  language: he        # primary language: "he" (Hebrew) or "en" (English)
  direction: rtl      # primary text direction: "rtl" or "ltr"

typography:
  hebrew_font: "Shofar"
  latin_font: "Source Sans 3"
  latin_font_serif: "Source Serif 4"
  code_font: "Source Code Pro"
  body_size: "12pt"
  prayer_size: "16pt"  # base size of ::: prayer blocks (English inside them)
  prayer_hebrew_size: "18pt"  # Hebrew-script runs inside prayer blocks
  # H3 is sized automatically so it never looks smaller than prayer text;
  # H2 and H1 step up from there.  This is the H1 : H3 ratio.
  heading_scale: 1.3

layout:
  paper: "a4"
  # For RTL books, "inner" is the right (binding) side.
  # Typst uses inside/outside for two-sided layouts; here we use explicit sides.
  top_margin: "2.5cm"
  bottom_margin: "2.5cm"
  right_margin: "3cm"    # inner/binding margin for RTL
  left_margin: "2cm"     # outer margin for RTL
  two_sided: true

output:
  filename: "publication.pdf"
  draft: false

# Ordered list of content files relative to the content/ directory.
# title is optional; if omitted, the first H1 in the file is used.
content:
  - file: 00-cover.md
  - file: 01-toc.md
  - file: 00-introduction.md
    title: "Introduction"
  - file: torah-reading.md
    title: "Torah Reading / קְרִיאַת הַתּוֹרָה"
  - file: torah-blessings.md
    title: "Torah and Gomel Blessings / בִּרְכוֹת הַתּוֹרָה וְהַגּוֹמֵל"
  - file: haftarah-blessings.md
    title: "Haftarah Blessings / בִּרְכוֹת הַהַפְטָרָה"
  - folder: mishebairachs/
    title: "Mishebairach / מִי שֶׁבֵּרַךְ"
    id: mi-sheberach   # anchor for cross-references ([text](#mi-sheberach))
    files:
      - aliyot.md
      - hagbah-gelilah.md
      - family.md
      - ill-one.md
      - ill-many.md
      - birth.md
      - barmitzvah.md
      - chatan.md
      - new-member.md
      - soldier.md
      - vaad.md
  - folder: kaddishim/
    title: "Kaddishim / קדישים"
    id: kaddishim   # anchor for cross-references ([text](#kaddishim))
    files:
      - mourners.md
      - full.md
      - rabbis.md
      - half.md
  # Annexes: the laws behind the practical chapters.
  - file: aliyot-laws.md
    title: "Annex A: Laws of Aliyot / נִסְפָּח א: הֲלָכוֹת עֲלִיַּת הַתּוֹרָה"
  - file: gabbai-laws.md
    title: "Annex B: Laws of the Gabbai / נִסְפָּח ב: הֲלָכוֹת הַגַּבַּאי"
